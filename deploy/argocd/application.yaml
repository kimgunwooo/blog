apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-ops-log
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kimgunwooo/platform-ops-log.git
    targetRevision: HEAD
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-ops-log
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
