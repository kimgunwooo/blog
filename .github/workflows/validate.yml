name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  build:
    name: Build and render manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Render Kubernetes manifests
        run: kubectl kustomize deploy/k8s >/dev/null
