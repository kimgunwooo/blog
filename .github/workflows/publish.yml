name: Publish release image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing SemVer tag to recover, for example v0.12.0
        required: true
      skip_release:
        description: Skip Release creation when recovering an already-created Release
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/kimgunwooo/blog

jobs:
  release:
    name: Build, release, and promote
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0

      - name: Validate release tag and ops log
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag like v0.12.0, got: $tag" >&2
            exit 1
          fi

          if ! grep -Fq "version: '$tag'" src/pages/ops-log.astro; then
            echo "ops-log.astro does not contain an entry for $tag" >&2
            exit 1
          fi

          commit_sha="$(git rev-list -n 1 "$tag")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.tag }}

      - name: Create GitHub Release
        if: ${{ inputs.skip_release != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "${{ steps.release.outputs.commit_sha }}" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

      - name: Checkout main for manifest promotion
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update Argo CD image tag
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("deploy/k8s/kustomization.yaml")
          image_tag = os.environ["RELEASE_TAG"]
          text = path.read_text()
          updated = re.sub(r"newTag: .+", f"newTag: {image_tag}", text, count=1)
          if updated == text:
              raise SystemExit("newTag was not updated")
          path.write_text(updated)
          PY
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}

      - name: Commit Argo CD manifest update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deploy/k8s/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No manifest update needed."
            exit 0
          fi

          git commit -m "chore: promote blog to ${{ steps.release.outputs.tag }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
