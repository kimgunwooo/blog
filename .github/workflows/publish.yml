name: Publish release image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing SemVer tag to recover, for example v0.12.0
        required: true
      skip_release:
        description: Skip Release creation when recovering an already-created Release
        required: false
        default: false
        type: boolean

concurrency:
  group: blog-production-promotion
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/kimgunwooo/blog

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0

      - name: Validate release tag and ops log
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag like v0.12.0, got: $tag" >&2
            exit 1
          fi

          if ! grep -Fq "version: '$tag'" src/pages/ops-log.astro; then
            echo "ops-log.astro does not contain an entry for $tag" >&2
            exit 1
          fi

          commit_sha="$(git rev-list -n 1 "$tag")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Render Kubernetes manifests
        run: kubectl kustomize deploy/k8s >/dev/null

      - name: Write validation summary
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
        run: |
          {
            echo "## Release 배포 · Validate"
            echo ""
            echo "- Release tag: [\`${RELEASE_TAG}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG})"
            echo "- Source commit: [\`${RELEASE_COMMIT_SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${RELEASE_COMMIT_SHA})"
            echo "- Result: ops log, site build, and Kustomize render passed"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build image and create Release
    needs: validate
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}

      - name: Create GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_release != true }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_COMMIT_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

      - name: Write image and Release summary
        run: |
          {
            echo "## Release 배포 · Build"
            echo ""
            echo "- Release tag: [\`${RELEASE_TAG}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG})"
            echo "- Source commit: [\`${RELEASE_COMMIT_SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${RELEASE_COMMIT_SHA})"
            echo "- Image: \`${IMAGE_NAME}:${RELEASE_TAG}\`"
            echo "- Result: multi-architecture image pushed to GHCR"
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote release image to Argo CD
    needs: [validate, build]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}

    steps:
      - name: Checkout main for manifest promotion
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update Argo CD image tag
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("deploy/k8s/kustomization.yaml")
          image_tag = os.environ["RELEASE_TAG"]
          text = path.read_text()
          updated = re.sub(r"newTag: .+", f"newTag: {image_tag}", text, count=1)
          if updated == text:
              if not re.search(r"newTag: .+", text):
                  raise SystemExit("newTag was not found")
              print(f"newTag is already {image_tag}")
          else:
              path.write_text(updated)
          PY

      - name: Commit Argo CD manifest update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deploy/k8s/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No manifest update needed."
          else
            git commit -m "chore(release): promote blog to ${RELEASE_TAG} [deploy:release] [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Write promotion summary
        run: |
          promotion_sha="$(git rev-parse HEAD)"
          {
            echo "## Release 배포 · Promote"
            echo ""
            echo "- Release tag: [\`${RELEASE_TAG}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG})"
            echo "- Source commit: [\`${RELEASE_COMMIT_SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${RELEASE_COMMIT_SHA})"
            echo "- Image: \`${IMAGE_NAME}:${RELEASE_TAG}\`"
            echo "- Promotion commit: [\`${promotion_sha:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${promotion_sha})"
            echo "- Argo CD Application: \`blog\`"
            echo "- Next: Argo CD detects \`deploy/k8s\` and syncs the desired state"
          } >> "$GITHUB_STEP_SUMMARY"
